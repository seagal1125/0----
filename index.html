<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新排行 MusicBook Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-glow"></div>

    <header class="glass-header">
        <div class="header-content">
            <div class="logo">
                <h1>MusicBook <span class="highlight">Viewer</span></h1>
                <p class="subtitle">最新排行簡譜資料庫</p>
            </div>
            <div class="controls">
                <div class="search-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜尋歌名、歌手...">
                </div>
                <div class="filter-box">
                    <label for="volumeSelect">冊別</label>
                    <div class="select-wrapper">
                        <select id="volumeSelect">
                            <option value="all">全部冊別</option>
                            <!-- Options will be populated by JS -->
                        </select>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <a href="index_yt.html" class="yt-link" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z">
                        </path>
                        <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                    </svg>
                    聽音樂 (YouTube)
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="status-bar">
            <span id="totalCount">載入中...</span>
        </div>

        <div class="table-container glass-panel">
            <table>
                <thead>
                    <tr>
                        <th data-sort="book">書名</th>
                        <th data-sort="song">曲名</th>
                        <th data-sort="singer">演唱歌手</th>
                        <th data-sort="volume">冊別</th>
                        <th data-sort="page">頁別</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="musicTableBody">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>正在載入資料庫...</p>
    </div>

    <script src="app.js"></script>
</body>

</html>
